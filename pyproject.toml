[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "seccart2"
dynamic = ["version"]
description = "Secure Cartography 2 - SNMP/SSH network discovery and topology mapping"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Scott Peterman", email = "scottpeterman@gmail.com"},
]
keywords = [
    "network",
    "discovery",
    "topology",
    "snmp",
    "ssh",
    "cdp",
    "lldp",
    "cisco",
    "arista",
    "juniper",
    "network-automation",
    "network-mapping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # Discovery engine
    "pysnmp>=7.1",
    # Vendored SSH client (sc2.scng.reachssh). Held below 4.x: newer Paramiko
    # drops diffie-hellman-group1/14-sha1, gex-sha1 and ssh-dss, which the
    # legacy-device path depends on.
    "paramiko>=3.4,<4",
    "textfsm>=1.1",
    "click>=8.0",          # imported at module load by scng.utils.tfsm_fire
    "PyYAML>=6.0",         # jump-host registry
    "aiofiles>=23.0",

    # Credential vault
    "cryptography>=42.0",

    # GUI
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",

    # Exports / device poll
    "openpyxl>=3.1",
    "requests>=2.30",
]


[project.optional-dependencies]
audit = [
    "reportlab>=4.0",      # PDF audit report (scng.audit report)
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]


[project.urls]
Homepage = "https://github.com/scottpeterman/securecartography2"
Documentation = "https://github.com/scottpeterman/securecartography2#readme"
Repository = "https://github.com/scottpeterman/securecartography2"
Issues = "https://github.com/scottpeterman/securecartography2/issues"


[project.scripts]
seccart2-creds = "sc2.scng.creds.cli:main"
seccart2-discover = "sc2.scng.discovery.cli:main"
seccart2-audit = "sc2.scng.audit.cli:main"

[project.gui-scripts]
seccart2 = "sc2.ui.__main__:main"


# ─── Setuptools Configuration ───────────────────────────────────

[tool.setuptools.dynamic]
version = {attr = "sc2.__version__"}

[tool.setuptools.packages.find]
include = ["sc2*"]

[tool.setuptools.package-data]
sc2 = [
    "**/*.html",
    "**/*.css",
    "**/*.js",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.svg",
    "**/*.ico",
    "**/*.gif",
    "**/*.json",
    "**/*.txt",
]
"sc2.scng.utils" = [
    "tfsm_templates.db",
]


# ─── Tool Configuration ─────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
